<!doctype html>
<html lang="{{ page.lang | default: page.language | default: site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/favicon.jpg' | relative_url }}">
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var storedTheme = localStorage.getItem('theme-preference');
        if (storedTheme === 'dark' || storedTheme === 'light') {
          root.setAttribute('data-theme', storedTheme);
        } else if (window.matchMedia) {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
</head>
<body>
  <div class="site">
    {% include site_header.html %}

    <main class="page-shell">
      <section class="page-header">
        <a class="text-link" href="{{ '/' | relative_url }}">← All writeups &amp; results</a>
        <h1 class="page-title">{{ page.title }}</h1>

        <div class="page-rank">
          {% include writeup_rank.html writeup=page %}
        </div>
        {% include writeup_meta.html writeup=page %}
      </section>

      <nav class="toc" aria-label="Table of contents" hidden>
        <h1 class="toc-title">Index</h1>
        <ul class="toc-list"></ul>
      </nav>

      <article class="prose">
        {{ content }}
      </article>

      <div class="back-link">
        <a class="text-link" href="{{ '/' | relative_url }}">← All writeups &amp; results</a>
      </div>
    </main>
  </div>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
</body>
</html>

<div class="card-grid">
  {% for writeup in include.writeups %}
    {% if writeup.layout == "result" %}
  <article class="card">
    {% else %}
  <a class="card" href="{{ writeup.url | relative_url }}">
    {% endif %}
    <div class="card-rank">
      {% include writeup_rank.html writeup=writeup list=true %}
    </div>
    <h3 class="card-title">{{ writeup.title }}</h3>
    {% include writeup_meta.html writeup=writeup %}
    {% if writeup.layout == "result" %}
  </article>
    {% else %}
  </a>
    {% endif %}
  {% endfor %}
</div>
